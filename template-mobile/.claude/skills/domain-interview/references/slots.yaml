# 도메인 인터뷰 슬롯 정의
#
# 이 파일은 인터뷰에서 "무엇을 채워야 끝나는가"를 정의한다.
# required: true 슬롯이 전부 채워지고, 미해결 모순이 0이 되어야 인터뷰가 complete 상태가 된다.
#
# 인터뷰는 2단계로 진행된다:
#   Phase 0 (discovery): 막연한 의도에서 도메인 자체를 발견하고 경계를 긋는다.
#                        docs/domains/_discovery/interview.json 에 기록.
#   Phase 1 (per-domain): 발견된 각 도메인을 슬롯 채우기로 심층 인터뷰한다.
#                        docs/domains/<domain>/interview.json 에 기록.
#
# 도메인마다 슬롯 세트가 다르다. Phase 0의 발견 결과에서 도메인 유형이 추론되며,
# 특정 도메인은 docs/domains/<domain>/slots.override.yaml 로 덮어쓸 수 있다.

version: 2

# ── 슬롯 묶음 프리셋 ──────────────────────────────────────────
# 도메인 성격에 따라 어떤 슬롯을 required로 둘지 정한 추천 프리셋.
# discovery는 Phase 0 전용. 나머지는 Phase 1에서 도메인 유형에 따라 자동 적용.
presets:
  discovery:      [intent, domain_map, boundaries]
  default:        [data_model, api_contract, error_handling, edge_cases]
  auth:           [data_model, auth_flow, api_contract, error_handling, edge_cases]
  external_api:   [api_contract, external_deps, error_handling, edge_cases]
  crud:           [data_model, api_contract, error_handling, edge_cases]

# ── Phase 0: 도메인 발견 슬롯 ────────────────────────────────
discovery_slots:
  intent:
    required: true
    description: "사용자가 무엇을 만들려는지, 그 시스템의 목적과 범위"
    fields:
      - goal              # 무엇을 만들려 하는가 (한 문장)
      - actors            # 누가 사용하는가 (사용자 유형)
      - in_scope          # 이번에 만들 것
      - out_of_scope      # 이번엔 안 만들 것 (범위 경계)

  domain_map:
    required: true
    description: "의도에서 추출한 도메인 후보 목록과 각 유형"
    fields:
      - candidates        # 등장하는 명사/행위에서 뽑은 도메인 후보
      - grouping          # 어떤 후보들을 하나의 도메인으로 묶었는가 + 그 근거
      - types             # 각 도메인의 유형 (auth/crud/external_api/default)

  boundaries:
    required: true
    description: "도메인 간 경계, 의존관계, 공유 개념의 모순 점검"
    fields:
      - dependencies      # 어느 도메인이 어느 도메인을 호출/의존하는가
      - shared_concepts   # 여러 도메인에 걸친 개념 (예: '사용자')과 그 소유 도메인
      - cycles            # 순환 의존 존재 여부와 해소 방안
      - overlaps          # 도메인 간 책임 중복 여부와 정리

# ── Phase 1: 도메인별 심층 슬롯 ──────────────────────────────
slots:
  data_model:
    required: true
    description: "핵심 엔티티와 관계, 불변 제약, 생명주기"
    fields:
      - entities          # 어떤 엔티티가 있는가
      - relationships     # 엔티티 간 관계 (1:1, 1:N, N:M)와 방향
      - key_constraints   # 불변 제약 (유니크, 필수, 값 범위)
      - lifecycle         # 생성→변경→삭제 흐름, 소프트삭제 여부

  api_contract:
    required: true
    description: "외부에 노출하거나 의존하는 계약의 모양"
    fields:
      - endpoints         # 경로/메서드 목록
      - request_shape     # 요청 본문/파라미터 구조
      - response_shape    # 응답 구조 (성공)
      - error_codes       # 에러 응답 형태와 코드 체계
      - idempotency       # 멱등성 보장 여부와 방법 (키 등)

  auth_flow:
    required: false       # auth 프리셋에서 required로 격상
    description: "인증 주체, 방식, 세션 모델, 권한 경계"
    fields:
      - actors            # 누가 (사용자/서비스/관리자)
      - auth_method       # 무엇으로 (JWT/세션/OAuth/API key)
      - session_model     # stateless vs stateful, 만료/갱신
      - permission_boundary # 무엇을 할 수 있고 없는가

  error_handling:
    required: true
    description: "실패 모드, 재시도 정책, 사용자에게 보이는 동작"
    fields:
      - failure_modes     # 어떤 실패가 일어날 수 있는가
      - retry_policy      # 재시도 여부/횟수/백오프
      - user_facing_behavior # 실패 시 사용자가 보는 것

  edge_cases:
    required: false
    description: "동시성, 빈 상태, 한계값, 경쟁 조건"
    fields:
      - concurrency       # 동시 접근/수정 처리
      - empty_states      # 데이터 없음 상태
      - limits            # 페이지네이션/크기/요율 한계
      - race_conditions   # 경쟁 조건 가능 지점

  external_deps:
    required: false       # external_api 프리셋에서 required로 격상
    description: "의존하는 외부 서비스와 그 계약, 실패 대비, 비용"
    fields:
      - services          # 어떤 외부 서비스
      - contracts         # 그 서비스가 보장하는/요구하는 계약
      - failure_fallback  # 외부 서비스 장애 시 대응
      - cost_model        # 호출당 비용/요율 한계 (해당 시)
