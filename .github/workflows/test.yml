name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    name: hooks · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9: macOS 기본 /usr/bin/python3. 이보다 새 문법이 들어오면 여기서 깨진다
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: 회귀 테스트 (워크플로우 흐름 포함, Playwright 테스트는 design 잡에서)
        env:
          HARNESS_REQUIRE: node
        run: bash tests/run_all.sh

  design:
    name: design · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Playwright 설치
        run: |
          npm i --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: capture.mjs 측정 테스트
        env:
          HARNESS_REQUIRE: node,playwright
        run: python3 -m unittest -v test_design
        working-directory: tests
