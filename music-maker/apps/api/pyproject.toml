[project]
name = "mureka-studio-api"
version = "0.1.0"
description = "Music Maker FastAPI backend (Mureka Studio)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.4",
  "python-json-logger>=2.0",
  "sentry-sdk[fastapi,celery]>=2.14",
  "boto3>=1.35",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "openai>=1.40",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis>=4.6",
  "testcontainers[postgres,redis]>=4.8",
  "fakeredis>=2.24",
  "aiosqlite>=0.20",
]
load = [
  "locust>=2.16",
  "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests requiring infrastructure",
  "unit: pure unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "S105", "S106", "B008"]  # asserts in tests, password strings (env), Depends in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
