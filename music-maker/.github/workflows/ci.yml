name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ==========================================================================
  # LINT STAGE (parallel)
  # ==========================================================================

  lint-api:
    runs-on: ubuntu-latest
    name: "Lint: API (Ruff + MyPy)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"
      - name: Ruff check
        run: cd apps/api && ruff check .
      - name: Ruff format check
        run: cd apps/api && ruff format --check .
      - name: MyPy type check
        run: cd apps/api && mypy app

  lint-web:
    runs-on: ubuntu-latest
    name: "Lint: Web (ESLint)"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: cd apps/web && pnpm lint
      - name: TypeScript check
        run: cd apps/web && pnpm typecheck

  # ==========================================================================
  # UNIT TESTS (after lint, parallel)
  # ==========================================================================

  test-unit-api:
    runs-on: ubuntu-latest
    name: "Unit Tests: API"
    needs: [lint-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"
      - name: Pytest (unit)
        run: |
          cd apps/api
          pytest tests/unit -v --cov=app --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage.xml
          flags: api-unit

  test-unit-web:
    runs-on: ubuntu-latest
    name: "Unit Tests: Web"
    needs: [lint-web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: cd apps/web && pnpm test
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/web/coverage/coverage-final.json
          flags: web-unit

  # ==========================================================================
  # INTEGRATION TESTS (after unit)
  # ==========================================================================

  test-integration-api:
    runs-on: ubuntu-latest
    name: "Integration Tests: API"
    needs: [test-unit-api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"
      - name: Pytest (integration)
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/15
          MUREKA_API_KEY: test_dummy
          JWT_SIGNING_KEY: test_secret
        run: |
          cd apps/api
          pytest tests/integration -v -m integration

  # ==========================================================================
  # E2E TESTS (after integration)
  # ==========================================================================

  test-e2e-web:
    runs-on: ubuntu-latest
    name: "E2E Tests: Web (Chromium)"
    needs: [test-integration-api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install chromium
      - name: Playwright tests (chromium only in PR)
        run: cd apps/web && pnpm test:e2e --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ==========================================================================
  # BUILD CHECKS (parallel, after unit)
  # ==========================================================================

  build-api:
    runs-on: ubuntu-latest
    name: "Build Check: API (Docker)"
    needs: [test-unit-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    name: "Build Check: Web"
    needs: [test-unit-web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Next.js build
        run: cd apps/web && pnpm build

  # ==========================================================================
  # SUMMARY (final stage, all tests must pass)
  # ==========================================================================

  all-checks-pass:
    name: "All Checks Pass"
    runs-on: ubuntu-latest
    needs:
      - lint-api
      - lint-web
      - test-unit-api
      - test-unit-web
      - test-integration-api
      - test-e2e-web
      - build-api
      - build-web
    if: always()
    steps:
      - name: Decide status
        run: |
          if [[ "${{ needs.lint-api.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-web.result }}" == "failure" ]] || \
             [[ "${{ needs.test-unit-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-unit-web.result }}" == "failure" ]] || \
             [[ "${{ needs.test-integration-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-e2e-web.result }}" == "failure" ]] || \
             [[ "${{ needs.build-api.result }}" == "failure" ]] || \
             [[ "${{ needs.build-web.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"

  # ==========================================================================
  # DEPLOY TO STAGING (main branch only)
  # ==========================================================================

  deploy-staging:
    runs-on: ubuntu-latest
    name: "Deploy to Staging"
    needs: [all-checks-pass]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: echo "Deploying to staging... (integration needed)"

  # ==========================================================================
  # SMOKE TESTS (after staging deploy)
  # ==========================================================================

  smoke-tests:
    runs-on: ubuntu-latest
    name: "Smoke Tests (Staging)"
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install chromium
      - name: Smoke tests
        env:
          RUN_SMOKE: '1'
        run: cd apps/web && pnpm test:e2e --grep @smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: apps/web/playwright-report/
          retention-days: 7
